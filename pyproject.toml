[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ca-pa"
version = "0.1.4"
description = "Lightweight macOS app to inspect the layer structure of large layered TIFF/PSD files without loading pixels"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
dependencies = [
    "psd-tools>=1.13",
    "PySide6>=6.5",
]

[project.scripts]
ca-pa = "ca_pa:main"

[project.optional-dependencies]
dev = ["pytest>=8"]
app = ["pyinstaller>=6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ca_pa = ["resources/*.png", "resources/*.icns", "resources/*.ico"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
