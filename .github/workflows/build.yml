# Build and release the ca-pa macOS app.
#
#   * every push to a version tag (v*)  -> tests, build the .app,
#                                          one GitHub Release with the zip:
#                                            ca-pa-macos-arm64.zip (Apple Silicon)
#   * "Run workflow" (manual)           -> same build, artifacts only
#
# The build must happen on macOS because PyInstaller is not cross-platform:
# a Linux runner cannot produce a .app bundle.  The arm64 leg builds natively
# on the (plentiful) Apple Silicon runner.  An x86_64 (Intel, Rosetta 2) leg
# is prepared but currently disabled: the runner images don't offer a Python
# 3.11 x86_64 build to actions/setup-python yet, so the setup step fails.
# See the matrix comment for the exact TODO.
name: build

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Version tag to attach the release to"
        required: true
        default: "v0.1.0"

permissions:
  contents: write   # let the release step create a GitHub Release

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: python -m venv .venv && .venv/bin/pip install -e ".[dev,app]"
      - name: Test suite
        run: .venv/bin/python -m pytest -q

  build:
    runs-on: macos-latest   # Apple Silicon box; Intel leg runs under Rosetta
    needs: test
    strategy:
      fail-fast: false          # let the other arch finish even if one fails
      matrix:
        arch: [arm64]
        # TODO(intel): the x86_64 leg is parked for now — the current
        # macos runner images don't ship a Python 3.11 x86_64 build that
        # actions/setup-python accepts, so that leg fails in setup.  Re-add
        # "x86_64" here (Rosetta 2 handles the emulation) once a working
        # interpreter version for the image is pinned.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          architecture: ${{ matrix.arch }}   # x86_64 => Rosetta 2
      - name: Architecture check
        run: |
          echo "python says: $(python -c 'import platform; print(platform.machine())')"
          file "$(command -v python)"
      - name: Install
        run: python -m venv .venv && .venv/bin/pip install -e ".[app]"
      - name: Architecture label
        id: meta
        run: |
          if [[ "${{ matrix.arch }}" == "x86_64" ]]; then
            echo "arch=intel" >> "$GITHUB_OUTPUT"
          else
            echo "arch=arm64" >> "$GITHUB_OUTPUT"
          fi
      - name: Full-resolution icon (sips + iconutil)
        run: scripts/make_icon.sh
      - name: Build .app with PyInstaller
        run: .venv/bin/pyinstaller --clean --noconfirm ca-pa.spec
      - name: Verify bundle architecture
        run: file dist/ca-pa.app/Contents/MacOS/ca-pa
      - name: Package
        run: |
          cd dist
          zip -qr "ca-pa-macos-${{ steps.meta.outputs.arch }}.zip" ca-pa.app
          ls -lh "ca-pa-macos-${{ steps.meta.outputs.arch }}.zip"
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ca-pa-macos-${{ steps.meta.outputs.arch }}
          path: dist/ca-pa-macos-${{ steps.meta.outputs.arch }}.zip

  release:
    runs-on: macos-latest
    needs: build
    steps:
      - name: Download arm64 build
        uses: actions/download-artifact@v4
        with:
          name: ca-pa-macos-arm64
          path: dist/arm64
      # The Intel (x86_64) zip is coming: the build leg is currently
      # disabled (see the matrix above).  Re-add this step when it returns:
      #
      #   - name: Download Intel build
      #     uses: actions/download-artifact@v4
      #     with:
      #       name: ca-pa-macos-intel
      #       path: dist/intel

      # Publish a GitHub Release only for real tag pushes; manual runs keep
      # their artifacts in the run page instead.
      - name: Create release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ca-pa ${{ github.ref_name }}
          files: |
            dist/arm64/ca-pa-macos-arm64.zip
          body: |
            ca-pa — inspect the layer structure of big layered TIFF/PSD files
            without decoding the pixels.

            **Which file do I download?**

            | Chip | File |
            |---|---|
            | Apple Silicon (M1/M2/M3/M4…) | `ca-pa-macos-arm64.zip` |
            | Intel | *coming in the next release* |

            Unzip and drag your layered files onto the window.
