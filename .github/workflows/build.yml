# Build and release ca-pa for macOS and Windows.
#
#   * every push to a version tag (v*)  -> tests, build the app,
#                                          one GitHub Release with the zips:
#                                            ca-pa-macos-arm64.zip  (Apple Silicon)
#                                            ca-pa-macos-intel.zip  (Intel, + Rosetta)
#                                            ca-pa-windows-x64.zip  (Windows 10/11 x64)
#   * "Run workflow" (manual)           -> same build, artifacts only
#
# The app must be assembled on its target platform (PyInstaller does not
# cross-compile).  All macOS legs run on the one `macos-latest` (Apple
# Silicon) runner: arm64 natively, x86_64 under Rosetta 2 — the x86_64 leg
# installs a pinned python-build-standalone interpreter, because the runner
# images no longer ship an x86_64 Python that actions/setup-python will
# resolve.  The Windows leg runs on `windows-latest`.
name: build

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Version tag to attach the release to"
        required: true
        default: "v0.1.3"

permissions:
  contents: write   # let the release step create a GitHub Release

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false          # one OS failing must not sink the other
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: python -m pip install -e ".[dev,app]"
      - name: Test suite
        # QT_QPA_PLATFORM=offscreen is set by tests/conftest.py, so the
        # suite is headless on every OS.
        run: python -m pytest -q

  build:
    runs-on: ${{ matrix.os }}
    needs: test
    strategy:
      fail-fast: false          # let the other builds finish even if one fails
      matrix:
        include:
          - os: macos-latest
            arch: arm64
            pyarch: arm64
            label: macos-arm64
          - os: macos-latest
            arch: x86_64
            pyarch: x86_64
            label: macos-intel
          - os: windows-latest
            arch: amd64
            pyarch: x64
            label: windows-x64
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        # Every leg except the macOS x86_64 one, whose interpreter does not
        # exist in the runner image (see next step).
        if: "!(matrix.os == 'macos-latest' && matrix.arch == 'x86_64')"
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          architecture: ${{ matrix.pyarch }}
      - name: Set up Python (x86_64 via pinned python-build-standalone)
        if: matrix.os == 'macos-latest' && matrix.arch == 'x86_64'
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL -o py.tar.gz \
            "https://github.com/indygreg/python-build-standalone/releases/download/20240814/cpython-3.11.9%2B20240814-x86_64-apple-darwin-install_only.tar.gz"
          mkdir -p "$RUNNER_TEMP/pbx86"
          tar -xzf py.tar.gz -C "$RUNNER_TEMP/pbx86" --strip-components=1
          echo "$RUNNER_TEMP/pbx86/bin" >> "$GITHUB_PATH"
      - name: Architecture check
        shell: bash
        run: |
          echo "python says: $(python -c 'import platform; print(platform.machine())')"
          file "$(command -v python)" || ls -l "$(command -v python)"
      - name: Create venv and install (macOS)
        if: matrix.os != 'windows-latest'
        shell: bash
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -e ".[app]"
      - name: Create venv and install (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          python -m venv .venv
          .\.venv\Scripts\python.exe -m pip install --upgrade pip
          .\.venv\Scripts\python.exe -m pip install -e ".[app]"
      - name: Build with PyInstaller (macOS)
        if: matrix.os != 'windows-latest'
        shell: bash
        run: |
          set -euo pipefail
          # The build log lands in the step summary so a failure is readable
          # from the public run page (logs themselves need auth).
          if ! .venv/bin/pyinstaller --clean --noconfirm ca-pa.spec > build.log 2>&1; then
            { echo '## PyInstaller failed' ; echo '```'; tail -60 build.log; echo '```' ; } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          tail -5 build.log >> "$GITHUB_STEP_SUMMARY"
      - name: Build with PyInstaller (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          try {
            & .\.venv\Scripts\pyinstaller.exe --clean --noconfirm ca-pa.spec *>&1 | Out-File -FilePath build.log -Encoding utf8
          } finally {
            Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "## PyInstaller output (tail)"
            Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value '```'
            Get-Content build.log -Tail 60 | ForEach-Object { Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value $_ }
            Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value '```'
          }
          if (Test-Path dist/ca-pa/ca-pa.exe) { Write-Host "ca-pa.exe built" } else { throw "ca-pa.exe missing" }
      - name: Smoke test the built app (macOS)
        if: matrix.os == 'macos-latest'
        shell: bash
        run: |
          export QT_QPA_PLATFORM=offscreen CA_PA_SMOKE=1
          ls -la dist/ >> "$GITHUB_STEP_SUMMARY" 2>&1 || true
          start=$(date +%s)
          dist/ca-pa.app/Contents/MacOS/ca-pa > smoke.log 2>&1 &
          pid=$!
          for _ in $(seq 1 90); do kill -0 "$pid" 2>/dev/null || break; sleep 1; done
          kill -9 "$pid" 2>/dev/null || true
          code=0
          wait "$pid" || code=$?
          elapsed=$(( $(date +%s) - start ))
          { echo "smoke: exit=$code elapsed=${elapsed}s"; echo '```'; tail -30 smoke.log; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          # The app must reach the 2 s smoke timer and exit cleanly through
          # window.close(); dying sooner means it never came up.
          if [ "$elapsed" -lt 2 ] || [ "$code" -ne 0 ]; then
            echo "smoke FAILED: exit=$code elapsed=${elapsed}s"
            exit 1
          fi
          echo "smoke OK: exit=$code elapsed=${elapsed}s"
      - name: Smoke test the built app (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $env:QT_QPA_PLATFORM = "offscreen"
          $env:CA_PA_SMOKE = "1"
          # The console twin: a windowed exe writes nothing, so ca-pa-c is
          # the only build whose output we can actually read.
          $sw = [System.Diagnostics.Stopwatch]::StartNew()
          & dist\ca-pa\ca-pa-c.exe *> smoke.log
          $code = $LASTEXITCODE
          $sw.Stop()
          $sec = [int]$sw.Elapsed.TotalSeconds
          "smoke: exit=$code elapsed=${sec}s" | Out-File smoke-result.txt -Encoding utf8
          Add-Content $env:GITHUB_STEP_SUMMARY "smoke: exit=$code elapsed=${sec}s"
          Get-Content smoke.log -Tail 40 | ForEach-Object { Add-Content $env:GITHUB_STEP_SUMMARY $_ }
          if ($sec -lt 2 -or $code -ne 0) { throw "smoke FAILED: exit=$code elapsed=${sec}s" }
          Write-Host "smoke OK: exit=$code elapsed=${sec}s"
      - name: Publish smoke diagnostics (on failure)
        if: failure()
        shell: bash
        run: |
          set -x
          {
            echo "platform: ${{ matrix.os }} / ${{ matrix.arch }}"
            echo "--- smoke result ---"
            [ -f smoke-result.txt ] && cat smoke-result.txt || echo "(no result)"
            echo "--- smoke.log (tail) ---"
            [ -s smoke.log ] && tail -60 smoke.log || echo "(smoke.log empty or missing)"
            echo "--- dist listing ---"
            ls -R dist 2>/dev/null | head -60 || echo "(no dist/)"
          } > ci-diag.txt
          git config user.name "ca-pa CI"
          git config user.email "ci@ca-pa.local"
          git checkout --orphan ci-debug 2>/dev/null || git checkout ci-debug
          git rm -rf . 2>/dev/null || true
          git add ci-diag.txt
          git commit -m "smoke diagnostics ${{ matrix.os }}/${{ matrix.arch }}" --allow-empty
          git push -f origin ci-debug
        continue-on-error: true
      - name: Verify output
        shell: bash
        run: |
          if [ "${{ matrix.os }}" = "macos-latest" ]; then
            file dist/ca-pa.app/Contents/MacOS/ca-pa
          else
            ls -lh dist/ca-pa/ca-pa.exe
          fi
      - name: Package (macOS)
        if: matrix.os == 'macos-latest'
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          # PyInstaller ships the PySide6/Qt trees in BOTH Contents/Resources
          # and Contents/Frameworks (the second is for the @rpath rewrites),
          # and zip follows symlinks, so the naive bundle quadruples.
          # Merge byte-identical twins (Frameworks copy -> relative symlink
          # to the Resources copy); anything that differs is left as-is.
          cd ca-pa.app/Contents
          find Frameworks/PySide6 -type f 2>/dev/null | while IFS= read -r f; do
            twin="Resources/PySide6/${f#Frameworks/PySide6/}"
            if [ -f "$twin" ] && cmp -s "$f" "$twin"; then
              rm "$f"
              ln -s "$(python3 -c 'import os,sys; print(os.path.relpath(sys.argv[1], os.path.dirname(sys.argv[2])))' "$twin" "$f")" "$f"
            fi
          done || true
          cd ../..
          # -y: store symlinks as links (Qt's Versions/A|Current chains)
          zip -qry "../ca-pa-${{ matrix.label }}.zip" ca-pa.app
          ls -lh "../ca-pa-${{ matrix.label }}.zip"
          # Smoke-test the *shipped* artifact: unzip and run it offscreen,
          # so the dedupe/symlink step is verified, not just assumed.
          mkdir _smoke && unzip -q "../ca-pa-${{ matrix.label }}.zip" -d _smoke
          export QT_QPA_PLATFORM=offscreen CA_PA_SMOKE=1
          start=$(date +%s)
          _smoke/ca-pa.app/Contents/MacOS/ca-pa > _smoke/log 2>&1 &
          pid=$!
          for _ in $(seq 1 90); do kill -0 "$pid" 2>/dev/null || break; sleep 1; done
          kill -9 "$pid" 2>/dev/null || true
          code=0
          wait "$pid" || code=$?
          elapsed=$(( $(date +%s) - start ))
          tail -20 _smoke/log
          if [ "$elapsed" -lt 2 ] || [ "$code" -ne 0 ]; then
            echo "shipped-zip smoke FAILED: exit=$code elapsed=${elapsed}s"
            exit 1
          fi
          echo "shipped-zip smoke OK: exit=$code elapsed=${elapsed}s"
      - name: Package (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          Remove-Item dist\ca-pa\ca-pa-c.exe -ErrorAction SilentlyContinue
          Compress-Archive -Path dist/ca-pa -DestinationPath "ca-pa-${{ matrix.label }}.zip"
          Get-Item "ca-pa-${{ matrix.label }}.zip" | Format-Table Name, Length
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ca-pa-${{ matrix.label }}
          path: ca-pa-${{ matrix.label }}.zip
          if-no-files-found: error

  release:
    runs-on: macos-latest
    needs: build
    steps:
      - name: Download arm64 build
        uses: actions/download-artifact@v4
        with:
          name: ca-pa-macos-arm64
          path: dist/arm64
      - name: Download Intel build
        uses: actions/download-artifact@v4
        with:
          name: ca-pa-macos-intel
          path: dist/intel
      - name: Download Windows build
        uses: actions/download-artifact@v4
        with:
          name: ca-pa-windows-x64
          path: dist/windows

      # Publish a GitHub Release only for real tag pushes; manual runs keep
      # their artifacts in the run page instead.
      - name: Create release
        if: github.event_name == 'push' && !contains(github.ref_name, 'dbg')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ca-pa ${{ github.ref_name }}
          files: |
            dist/arm64/ca-pa-macos-arm64.zip
            dist/intel/ca-pa-macos-intel.zip
            dist/windows/ca-pa-windows-x64.zip
          body: |
            ca-pa — inspect the layer structure of big layered TIFF/PSD files
            without decoding the pixels.

            **Which file do I download?**

            | Machine | File |
            |---|---|
            | Apple Silicon (M1/M2/M3/M4…) | `ca-pa-macos-arm64.zip` |
            | Intel Mac (or M-series via Rosetta 2) | `ca-pa-macos-intel.zip` |
            | Windows 10/11 (64-bit) | `ca-pa-windows-x64.zip` |

            **macOS:** unzip and you have `ca-pa.app` — drag your layered
            files onto the window.
            **Windows:** unzip and run `ca-pa.exe`; if SmartScreen asks,
            choose *More info* → *Run anyway* (the build is not code-signed).
            The app also works by dropping files onto the window.
