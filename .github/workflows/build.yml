# Build and release the ca-pa macOS app.
#
#   * every push to a version tag (v*)  -> tests, build for BOTH architectures,
#                                          one GitHub Release with two zips:
#                                            ca-pa-macos-arm64.zip  (Apple Silicon)
#                                            ca-pa-macos-intel.zip (Intel)
#   * "Run workflow" (manual)           -> same builds, artifacts only
#
# The build must happen on macOS because PyInstaller is not cross-platform:
# a Linux runner cannot produce a .app bundle.  Both architectures are built
# on the (plentiful) Apple Silicon runner: arm64 natively, x86_64 through
# Rosetta 2 (`actions/setup-python` with `architecture: x86_64` installs an
# x86_64 interpreter, and PyInstaller bundles exactly what it is running, so
# the resulting .app is a genuine Intel build).  This avoids the scarce
# `macos-13` Intel runners, which can sit queued for days.
name: build

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Version tag to attach the release to"
        required: true
        default: "v0.1.0"

permissions:
  contents: write   # let the release step create a GitHub Release

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: python -m venv .venv && .venv/bin/pip install -e ".[dev,app]"
      - name: Test suite
        run: .venv/bin/python -m pytest -q

  build:
    runs-on: macos-latest   # Apple Silicon box; Intel leg runs under Rosetta
    needs: test
    strategy:
      fail-fast: false          # let the other arch finish even if one fails
      matrix:
        arch: [arm64, x86_64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          architecture: ${{ matrix.arch }}   # x86_64 => Rosetta 2
      - name: Architecture check
        run: |
          echo "python says: $(python -c 'import platform; print(platform.machine())')"
          file "$(command -v python)"
      - name: Install
        run: python -m venv .venv && .venv/bin/pip install -e ".[app]"
      - name: Architecture label
        id: meta
        run: |
          if [[ "${{ matrix.arch }}" == "x86_64" ]]; then
            echo "arch=intel" >> "$GITHUB_OUTPUT"
          else
            echo "arch=arm64" >> "$GITHUB_OUTPUT"
          fi
      - name: Full-resolution icon (sips + iconutil)
        run: scripts/make_icon.sh
      - name: Build .app with PyInstaller
        run: .venv/bin/pyinstaller --clean --noconfirm ca-pa.spec
      - name: Verify bundle architecture
        run: file dist/ca-pa.app/Contents/MacOS/ca-pa
      - name: Package
        run: |
          cd dist
          zip -qr "ca-pa-macos-${{ steps.meta.outputs.arch }}.zip" ca-pa.app
          ls -lh "ca-pa-macos-${{ steps.meta.outputs.arch }}.zip"
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ca-pa-macos-${{ steps.meta.outputs.arch }}
          path: dist/ca-pa-macos-${{ steps.meta.outputs.arch }}.zip

  release:
    runs-on: macos-latest
    needs: build
    steps:
      - name: Download arm64 build
        uses: actions/download-artifact@v4
        with:
          name: ca-pa-macos-arm64
          path: dist/arm64
      - name: Download Intel build
        uses: actions/download-artifact@v4
        with:
          name: ca-pa-macos-intel
          path: dist/intel

      # Publish a GitHub Release only for real tag pushes; manual runs keep
      # their artifacts in the run page instead.
      - name: Create release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ca-pa ${{ github.ref_name }}
          files: |
            dist/arm64/ca-pa-macos-arm64.zip
            dist/intel/ca-pa-macos-intel.zip
          body: |
            ca-pa — inspect the layer structure of big layered TIFF/PSD files
            without decoding the pixels.

            **Which file do I download?**

            | Chip | File |
            |---|---|
            | Apple Silicon (M1/M2/M3/M4…) | `ca-pa-macos-arm64.zip` |
            | Intel (2020 or earlier) | `ca-pa-macos-intel.zip` |

            Unzip and drag your layered files onto the window.
