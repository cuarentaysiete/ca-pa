# Build and release the ca-pa macOS app.
#
#   * every push to a version tag (v*)  -> tests, build the .app,
#                                          one GitHub Release with the zips:
#                                            ca-pa-macos-arm64.zip (Apple Silicon)
#                                            ca-pa-macos-intel.zip  (Intel + Rosetta)
#   * "Run workflow" (manual)           -> same build, artifacts only
#
# The build must happen on macOS because PyInstaller is not cross-platform:
# a Linux runner cannot produce a .app bundle.  Both legs run on the Apple
# Silicon runner: the arm64 leg natively, the x86_64 leg under Rosetta 2.
#
# The x86_64 leg installs a pinned python-build-standalone CPython instead of
# relying on actions/setup-python: the current macos runner images no longer
# ship an x86_64 interpreter that setup-python will resolve, so the leg
# downloads a known-good x86_64 CPython 3.11 release directly.
name: build

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Version tag to attach the release to"
        required: true
        default: "v0.1.2"

permissions:
  contents: write   # let the release step create a GitHub Release

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: python -m venv .venv && .venv/bin/pip install -e ".[dev,app]"
      - name: Test suite
        run: .venv/bin/python -m pytest -q

  build:
    runs-on: macos-latest   # Apple Silicon box; the x86_64 leg runs under Rosetta 2
    needs: test
    strategy:
      fail-fast: false          # let the other arch finish even if one fails
      matrix:
        arch: [arm64, x86_64]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python (arm64)
        if: matrix.arch == 'arm64'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          architecture: arm64
      - name: Set up Python (x86_64 via Rosetta 2)
        if: matrix.arch == 'x86_64'
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL -o py.tar.gz \
            "https://github.com/indygreg/python-build-standalone/releases/download/20240814/cpython-3.11.9%2B20240814-x86_64-apple-darwin-install_only.tar.gz"
          mkdir -p "$RUNNER_TEMP/pbx86"
          tar -xzf py.tar.gz -C "$RUNNER_TEMP/pbx86" --strip-components=1
          echo "$RUNNER_TEMP/pbx86/bin" >> "$GITHUB_PATH"
          python -V
      - name: Architecture check
        run: |
          echo "python says: $(python -c 'import platform; print(platform.machine())')"
          file "$(command -v python)"
      - name: Install
        run: python -m venv .venv && .venv/bin/pip install -e ".[app]"
      - name: Architecture label
        id: meta
        run: |
          if [[ "${{ matrix.arch }}" == "x86_64" ]]; then
            echo "arch=intel" >> "$GITHUB_OUTPUT"
          else
            echo "arch=arm64" >> "$GITHUB_OUTPUT"
          fi
      - name: Full-resolution icon (sips + iconutil)
        run: scripts/make_icon.sh
      - name: Build .app with PyInstaller
        run: .venv/bin/pyinstaller --clean --noconfirm ca-pa.spec
      - name: Verify bundle architecture
        run: file dist/ca-pa.app/Contents/MacOS/ca-pa
      - name: Package
        run: |
          cd dist
          zip -qr "ca-pa-macos-${{ steps.meta.outputs.arch }}.zip" ca-pa.app
          ls -lh "ca-pa-macos-${{ steps.meta.outputs.arch }}.zip"
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ca-pa-macos-${{ steps.meta.outputs.arch }}
          path: dist/ca-pa-macos-${{ steps.meta.outputs.arch }}.zip

  release:
    runs-on: macos-latest
    needs: build
    steps:
      - name: Download arm64 build
        uses: actions/download-artifact@v4
        with:
          name: ca-pa-macos-arm64
          path: dist/arm64
      - name: Download Intel build
        uses: actions/download-artifact@v4
        with:
          name: ca-pa-macos-intel
          path: dist/intel

      # Publish a GitHub Release only for real tag pushes; manual runs keep
      # their artifacts in the run page instead.
      - name: Create release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ca-pa ${{ github.ref_name }}
          files: |
            dist/arm64/ca-pa-macos-arm64.zip
            dist/intel/ca-pa-macos-intel.zip
          body: |
            ca-pa — inspect the layer structure of big layered TIFF/PSD files
            without decoding the pixels.

            **Which file do I download?**

            | Chip | File |
            |---|---|
            | Apple Silicon (M1/M2/M3/M4…) | `ca-pa-macos-arm64.zip` |
            | Intel | `ca-pa-macos-intel.zip` |

            The Intel build also runs on Apple Silicon via Rosetta 2;
            download the arm64 zip if you have an M-series Mac.

            Unzip and drag your layered files onto the window.
